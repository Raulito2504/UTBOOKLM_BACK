[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utbooklm_back"
version = "0.1.0"
description = "Backend API for UTBookLM"
requires-python = ">=3.10"
dependencies = [
    # API Framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    
    # Base de Datos (SQLAlchemy)
    "sqlalchemy>=2.0.30",
    
    # Seguridad y Auth (JWT y Hasheo)
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    
    # RAG y Vector Store (ChromaDB)
    "chromadb>=0.5.0",
    
    # Otros
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py311"
